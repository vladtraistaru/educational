<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Number Scale Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="language-selector">
                <select id="language-select">
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                </select>
            </div>
            <h1 data-i18n="title">Number Scale Explorer</h1>
            <p class="subtitle" data-i18n="subtitle">Drag the markers to split the number line!</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="scale-select" data-i18n="scale">Scale:</label>
                <select id="scale-select">
                    <option value="10">0 - 10</option>
                    <option value="20">0 - 20</option>
                    <option value="50">0 - 50</option>
                    <option value="100" selected>0 - 100</option>
                    <option value="500">0 - 500</option>
                    <option value="1000">0 - 1000</option>
                </select>
            </div>
            <div class="control-buttons">
                <button id="add-cursor" class="btn btn-add">
                    <span class="btn-icon">+</span>
                    <span data-i18n="addMarker">Add Marker</span>
                </button>
                <button id="remove-cursor" class="btn btn-remove">
                    <span class="btn-icon">−</span>
                    <span data-i18n="remove">Remove</span>
                </button>
                <button id="reset" class="btn btn-reset">
                    <span class="btn-icon">↺</span>
                    <span data-i18n="reset">Reset</span>
                </button>
            </div>
        </div>

        <div class="number-line-container">
            <div class="number-line-wrapper">
                <span class="scale-label scale-start">0</span>
                <div class="number-line" id="number-line">
                    <div class="track"></div>
                    <div class="segments" id="segments"></div>
                    <div class="cursors" id="cursors"></div>
                    <div class="tick-marks" id="tick-marks"></div>
                </div>
                <span class="scale-label scale-end" id="scale-end">100</span>
            </div>
        </div>

        <div class="breakdown-panel">
            <h2 data-i18n="segments">Segments</h2>
            <div class="segments-list" id="segments-list"></div>
            <div class="total-equation" id="total-equation"></div>
        </div>

        <footer class="app-footer">
            <span data-i18n="madeBy">Made by Petru</span>
        </footer>
    </div>

    <script src="translations.js"></script>
    <script src="app.js"></script>
</body>
</html>
